# macOS: first page 3, subsequent pages 10. U+200B prevents surrogate splitting.
patch:
  xiaohe_pager/selection_modifier: Super
  xiaohe_pager/native_labels: false
  style:
    color_scheme: xiaohe_clear_blue
    color_scheme_dark: xiaohe_clear_blue_dark
    candidate_list_layout: linear
    text_orientation: horizontal
    inline_preedit: true
    inline_candidate: false
    font_face: MiSans-Regular, MiSans L3, AppleColorEmoji
    font_point: 16
    label_font_face: MiSans-Regular, MiSans L3, AppleColorEmoji
    label_font_point: 11
    comment_font_face: MiSans-Regular, MiSans L3, AppleColorEmoji
    comment_font_point: 11
    candidate_format: ​[comment][candidate]
    corner_radius: 3
    hilited_corner_radius: 2
    border_width: 4
    border_height: 0
    line_spacing: 0
    spacing: 0
    shadow_size: 0
    translucency: false
    memorize_size: false
    show_paging: false
  menu:
    page_size: 10
  preset_color_schemes:
    xiaohe_clear_blue:
      name: 极简 · 浅色
      author: Personal configuration · 使用 MiSans 字体
      color_space: srgb
      back_color: '0xF7F7F7'
      border_color: '0xF7F7F7'
      text_color: '0x464646'
      candidate_text_color: '0x464646'
      label_color: '0x888888'
      comment_text_color: '0x888888'
      hilited_back_color: '0xEBEBEB'
      hilited_text_color: '0x333333'
      hilited_candidate_back_color: '0xEBEBEB'
      hilited_candidate_text_color: '0x333333'
      hilited_candidate_label_color: '0x777777'
      hilited_comment_text_color: '0x777777'
    xiaohe_clear_blue_dark:
      name: 极简 · 深色
      author: Personal configuration · 使用 MiSans 字体
      color_space: srgb
      back_color: '0x252525'
      border_color: '0x252525'
      text_color: '0xC4C4C4'
      candidate_text_color: '0xC4C4C4'
      label_color: '0x888888'
      comment_text_color: '0x888888'
      hilited_back_color: '0x333333'
      hilited_text_color: '0xD5D5D5'
      hilited_candidate_back_color: '0x333333'
      hilited_candidate_text_color: '0xD5D5D5'
      hilited_candidate_label_color: '0x999999'
      hilited_comment_text_color: '0x999999'
  switches/@0/states:
  - ''
  - ''
  switches/@0/abbrev:
  - ''
  - ''
  engine/processors:
  - ascii_composer
  - lua_processor@*xiaohe_pager_keys
  - lua_processor@*loginput_keys
  - recognizer
  - key_binder
  - speller
  - punctuator
  - selector
  - navigator
  - express_editor
  engine/filters:
  - simplifier@traditional
  - uniquifier
  - lua_filter@*xiaohe_pager_filter
